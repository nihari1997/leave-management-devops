name: CI

env:
  PYTHON_VERSION: "3.13"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check Python syntax with PowerShell
        run: pwsh -File ./scripts/Validate-Application.ps1 -SkipTests

  test:
    name: Test application
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run validation with PowerShell
        run: pwsh -File ./scripts/Validate-Application.ps1 -TestResultPath test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  smoke-test:
    name: Smoke test application
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_PORT: "5050"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start application
        run: gunicorn --bind "127.0.0.1:${APP_PORT}" --log-file gunicorn.log --daemon app:app
      - name: Verify health endpoint with PowerShell
        run: >
          pwsh -File ./scripts/Invoke-HealthCheck.ps1
          -BaseUrl "http://127.0.0.1:${APP_PORT}"
          -RetryCount 5
          -RetryDelaySeconds 2
      - name: Show application log
        if: failure()
        run: cat gunicorn.log
      - name: Stop application
        if: always()
        run: pkill gunicorn || true

  package:
    name: Package application
    needs: smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create source package
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output "dist/leave-management-${GITHUB_SHA}.tar.gz" "$GITHUB_SHA"
      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: leave-management-source
          path: dist/
          retention-days: 7
