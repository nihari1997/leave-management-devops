<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leave Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main>
      <h1>Leave Management</h1>
      <p class="intro">Submit a leave request. This simple interface calls the Flask API.</p>
      <form id="leave-form">
        <label>Employee <select id="employee-id" required></select></label>
        <label>Start date <input id="start-date" type="date" required></label>
        <label>End date <input id="end-date" type="date" required></label>
        <label>Reason <textarea id="reason" required></textarea></label>
        <button type="submit">Submit request</button>
      </form>
      <p id="message" role="status"></p>
      <h2>Requests</h2>
      <ul id="leave-list"></ul>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
